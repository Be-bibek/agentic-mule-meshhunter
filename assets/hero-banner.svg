<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="300">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="300" fill="url(#bgGrad)" rx="16"/>
  
  <!-- Graph topology in the background -->
  <g stroke="#6366f1" stroke-width="2" stroke-opacity="0.4" filter="url(#glow)">
    <!-- Right side network -->
    <line x1="580" y1="120" x2="650" y2="150" />
    <line x1="650" y1="150" x2="720" y2="110" />
    <line x1="650" y1="150" x2="670" y2="230" />
    <line x1="670" y1="230" x2="740" y2="210" />
    <line x1="720" y1="110" x2="740" y2="210" stroke-dasharray="4 4" />
    <line x1="580" y1="120" x2="620" y2="60" />
    <line x1="620" y1="60" x2="720" y2="110" />
    
    <!-- Left side network -->
    <line x1="140" y1="220" x2="200" y2="150" />
    <line x1="200" y1="150" x2="110" y2="100" />
    <line x1="200" y1="150" x2="270" y2="120" />
    <line x1="270" y1="120" x2="300" y2="60" />
    <line x1="110" y1="100" x2="70" y2="160" />
    <line x1="70" y1="160" x2="140" y2="220" stroke-dasharray="4 4" />
  </g>
  
  <g fill="#a78bfa" filter="url(#glow)">
    <!-- Right side nodes -->
    <circle cx="580" cy="120" r="5" />
    <circle cx="650" cy="150" r="10" fill="#ec4899" stroke="#fff" stroke-width="2"/>
    <circle cx="720" cy="110" r="6" />
    <circle cx="670" cy="230" r="7" />
    <circle cx="740" cy="210" r="4" />
    <circle cx="620" cy="60" r="5" />
    
    <!-- Left side nodes -->
    <circle cx="140" cy="220" r="6" />
    <circle cx="200" cy="150" r="11" fill="#ec4899" stroke="#fff" stroke-width="2"/>
    <circle cx="110" cy="100" r="5" />
    <circle cx="270" cy="120" r="7" />
    <circle cx="300" cy="60" r="4" />
    <circle cx="70" cy="160" r="5" />
  </g>

  <!-- Title -->
  <text x="400" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    MULE RING SENTINEL
  </text>
  <text x="400" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#a78bfa" text-anchor="middle" letter-spacing="1.5">
    AUTONOMOUS AI SECURITY PLATFORM
  </text>
  
  <!-- Subtle tech badges -->
  <g transform="translate(305, 220)">
    <rect x="0" y="0" width="55" height="24" rx="4" fill="#ffffff" fill-opacity="0.1" />
    <text x="27.5" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">RUST</text>
  </g>
  <g transform="translate(370, 220)">
    <rect x="0" y="0" width="70" height="24" rx="4" fill="#ffffff" fill-opacity="0.1" />
    <text x="35" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">PYTHON</text>
  </g>
  <g transform="translate(450, 220)">
    <rect x="0" y="0" width="55" height="24" rx="4" fill="#ffffff" fill-opacity="0.1" />
    <text x="27.5" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">REACT</text>
  </g>
</svg>
